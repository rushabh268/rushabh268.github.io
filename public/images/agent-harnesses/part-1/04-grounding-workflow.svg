<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1855" viewBox="0 0 1440 1855" role="img" aria-labelledby="title desc"><title id="title">One request, two information flows</title><desc id="desc">Seven lifelines show the developer, native coding tool, companion adapter, shared grounding, project sources, supervisor and ledger, and dashboard. OpenCode refreshes context in the background and reads only its cache during the request. Claude Code and Codex collect through native callbacks. A redacted brief goes to the host; only selected metadata goes to the ledger. Disabled, missing, or failed context preparation leaves native execution running. Dashboard counts are observations, not proof of model reasoning.</desc>
    <defs>
      <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#126394"/></marker>
      <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#177C76"/></marker>
      <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#8C631A"/></marker>
      <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
    </defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="1855" fill="#FFFFFF"/><text x="56" y="52" font-size="19" fill="#126394" font-weight="700" text-anchor="start">INSIDE AN AGENT HARNESS   /   04</text><text x="56" y="108" font-size="39" fill="#173248" font-weight="700" text-anchor="start">One request, two information flows.</text><text x="56" y="149" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Project context goes to the coding tool. Selected audit metadata goes to the ledger.</text><rect x="34" y="180" width="172" height="72" rx="10" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="120" y="224" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Developer</text><rect x="234" y="180" width="172" height="72" rx="10" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="320" y="210" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Native coding</text><text x="320" y="236" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">tool</text><rect x="434" y="180" width="172" height="72" rx="10" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="520" y="210" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Companion</text><text x="520" y="236" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">adapter</text><rect x="634" y="180" width="172" height="72" rx="10" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="720" y="210" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Shared</text><text x="720" y="236" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">grounding</text><rect x="834" y="180" width="172" height="72" rx="10" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="920" y="210" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Project</text><text x="920" y="236" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">sources</text><rect x="1034" y="180" width="172" height="72" rx="10" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="1120" y="210" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Supervisor</text><text x="1120" y="236" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">+ ledger</text><rect x="1234" y="180" width="172" height="72" rx="10" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="1320" y="224" font-size="20" fill="#173248" font-weight="700" text-anchor="middle">Dashboard</text><rect x="40" y="282" width="1360" height="40" rx="5" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="58" y="309" font-size="22" fill="#173248" font-weight="700" text-anchor="start">1   Prepare cached context when the host uses a background cache</text><rect x="40" y="338" width="1360" height="246" rx="4" fill="#FAFDFC" stroke="#C9DCE7" stroke-width="2"/><rect x="40" y="338" width="58" height="29" rx="2" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="69" y="359" font-size="17" fill="#126394" font-weight="700" text-anchor="middle">opt</text><text x="112" y="360" font-size="18" fill="#526B7B" font-weight="400" text-anchor="start">OpenCode background refresh — before or independently of a request</text><rect x="40" y="602" width="1360" height="40" rx="5" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="58" y="629" font-size="22" fill="#173248" font-weight="700" text-anchor="start">2   The developer starts a request; the host asks its adapter for context</text><rect x="40" y="746" width="1360" height="334" rx="4" fill="#FAFDFC" stroke="#C9DCE7" stroke-width="2"/><rect x="40" y="746" width="58" height="29" rx="2" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="69" y="767" font-size="17" fill="#126394" font-weight="700" text-anchor="middle">alt</text><text x="112" y="768" font-size="18" fill="#526B7B" font-weight="400" text-anchor="start">Claude Code / Codex: collect on the native context callback</text><path d="M40 976 H1400" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 6"/><text x="112" y="1004" font-size="18" fill="#526B7B" font-weight="400" text-anchor="start">OpenCode: use the prepared cache only</text><rect x="40" y="1098" width="1360" height="40" rx="5" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="58" y="1125" font-size="22" fill="#173248" font-weight="700" text-anchor="start">3   Supply the brief through the host’s supported context interface</text><rect x="40" y="1154" width="1360" height="161" rx="4" fill="#FAFDFC" stroke="#C9DCE7" stroke-width="2"/><rect x="40" y="1154" width="58" height="29" rx="2" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="69" y="1175" font-size="17" fill="#126394" font-weight="700" text-anchor="middle">opt</text><text x="112" y="1176" font-size="18" fill="#526B7B" font-weight="400" text-anchor="start">A nonempty brief is available</text><rect x="40" y="1388" width="1360" height="40" rx="5" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="58" y="1415" font-size="22" fill="#173248" font-weight="700" text-anchor="start">4   The native tool runs the task; the companion records selected observations</text><rect x="40" y="1600" width="1360" height="128" rx="4" fill="#FAFCFD" stroke="#C9DCE7" stroke-width="2"/><rect x="40" y="1600" width="58" height="29" rx="2" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="69" y="1621" font-size="17" fill="#126394" font-weight="700" text-anchor="middle">opt</text><text x="112" y="1622" font-size="18" fill="#526B7B" font-weight="400" text-anchor="start">Dashboard is open — read a bounded recent event window</text><path d="M120 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M320 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M520 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M720 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M920 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M1120 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M1320 258 V1734" stroke="#C9DCE7" stroke-width="2" stroke-dasharray="7 7"/><path d="M 520 402 H 720" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="620.0" y="390" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Refresh</text><path d="M 720 464 H 920" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="820.0" y="452" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Read sources</text><path d="M 920 526 H 720" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="9 8"/><text x="820.0" y="514" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Notes + comments</text><path d="M 720 573 H 520" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="9 8"/><text x="620.0" y="561" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Brief → cache</text><path d="M 120 684 H 320" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="220.0" y="672" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Request</text><path d="M 320 729 H 520" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="420.0" y="717" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Context callback</text><path d="M 520 815 H 720" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="620.0" y="803" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Collect brief</text><path d="M 720 868 H 920" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="820.0" y="856" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Read sources</text><path d="M 920 921 H 720" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="9 8"/><text x="820.0" y="909" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Notes + comments</text><path d="M 720 965 H 520" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="9 8"/><text x="620.0" y="953" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Redacted, cited brief</text><path d="M 520 1025 H 584 V 1053 H 520" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="614" y="1045" font-size="18" fill="#177C76" font-weight="400" text-anchor="start">Cached brief; no Git, file, or socket work here</text><path d="M 520 1215 H 320" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="9 8"/><text x="420.0" y="1203" font-size="18" fill="#177C76" font-weight="500" text-anchor="middle">Brief to host</text><path d="M 520 1282 H 1120" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="820.0" y="1270" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Best-effort emission metadata only — no raw brief</text><text x="64" y="1353" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Disabled, no match, cold cache, or collection failure: continue without the extra brief.</text><path d="M 320 1465 H 408 V 1498 H 320" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="445" y="1471" font-size="20" fill="#173248" font-weight="600" text-anchor="start">Native model + tool execution</text><text x="445" y="1501" font-size="18" fill="#526B7B" font-weight="400" text-anchor="start">Native approvals, permissions, and context history</text><path d="M 320 1545 H 520" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="420.0" y="1533" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Selected activity</text><path d="M 520 1585 H 1120" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="820.0" y="1573" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Normalize + inspect → selected audit metadata only</text><path d="M 320 1585 H 120" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 8"/><text x="220.0" y="1573" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Result</text><path d="M 1320 1656 H 1120" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1220.0" y="1644" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Poll counts</text><path d="M 1120 1710 H 1320" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 8"/><text x="1220.0" y="1698" font-size="18" fill="#126394" font-weight="500" text-anchor="middle">Recent counts</text><text x="56" y="1780" font-size="23" fill="#173248" font-weight="500" text-anchor="start">An emission record shows that context was supplied. It does not prove the model used it.</text><text x="56" y="1820" font-size="20" fill="#526B7B" font-weight="400" text-anchor="start">Solid arrows: calls / events. Dashed arrows: returns. Each host owns execution and context retention.</text></g></svg>