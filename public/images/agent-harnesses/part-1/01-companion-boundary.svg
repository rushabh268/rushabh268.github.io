<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">Native and companion harnesses: context in, evidence out</title><desc id="desc">The coding tool owns execution, sessions, and permissions. The companion receives selected observations through supported extension points. Automatic grounding works across all three adapters.</desc>
    <defs>
      <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#126394"/></marker>
      <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#177C76"/></marker>
      <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#8C631A"/></marker>
      <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
    </defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="780" fill="#FFFFFF"/><text x="56" y="52" font-size="19" fill="#126394" font-weight="700" text-anchor="start">INSIDE AN AGENT HARNESS   /   01</text><text x="56" y="108" font-size="39" fill="#173248" font-weight="700" text-anchor="start">The coding tool keeps the agent loop.</text><text x="56" y="149" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">The companion participates through the tool’s supported integration points.</text><rect x="56" y="193" width="500" height="381" rx="22" fill="#F1F7FB" stroke="#B5D3E3" stroke-width="2"/><rect x="884" y="193" width="500" height="381" rx="22" fill="#EDF8F4" stroke="#B6DCD3" stroke-width="2"/><text x="88" y="248" font-size="34" fill="#126394" font-weight="700" text-anchor="start">Native harness</text><text x="88" y="286" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Claude Code · Codex · OpenCode</text><text x="916" y="248" font-size="34" fill="#177C76" font-weight="700" text-anchor="start">Companion harness</text><text x="916" y="286" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">The local layer you add</text><rect x="88" y="320" width="436" height="54" rx="11" fill="white" stroke="#D6E5EE" stroke-width="2"/><text x="108" y="355" font-size="23" fill="#173248" font-weight="400" text-anchor="start">Model + tool execution</text><rect x="916" y="320" width="436" height="54" rx="11" fill="white" stroke="#D4E9E2" stroke-width="2"/><text x="936" y="355" font-size="23" fill="#173248" font-weight="400" text-anchor="start">Relevant project context</text><rect x="88" y="393" width="436" height="54" rx="11" fill="white" stroke="#D6E5EE" stroke-width="2"/><text x="108" y="428" font-size="23" fill="#173248" font-weight="400" text-anchor="start">Sessions + context management</text><rect x="916" y="393" width="436" height="54" rx="11" fill="white" stroke="#D4E9E2" stroke-width="2"/><text x="936" y="428" font-size="23" fill="#173248" font-weight="400" text-anchor="start">Selected event records</text><rect x="88" y="466" width="436" height="54" rx="11" fill="white" stroke="#D6E5EE" stroke-width="2"/><text x="108" y="501" font-size="23" fill="#173248" font-weight="400" text-anchor="start">Configured permissions + isolation</text><rect x="916" y="466" width="436" height="54" rx="11" fill="white" stroke="#D4E9E2" stroke-width="2"/><text x="936" y="501" font-size="23" fill="#173248" font-weight="400" text-anchor="start">Ledger + dashboard</text><path d="M 869 343 H 572" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="720" y="291" font-size="27" fill="#177C76" font-weight="700" text-anchor="middle">Context in</text><text x="720" y="322" font-size="23" fill="#177C76" font-weight="400" text-anchor="middle">All three adapters</text><text x="720" y="403" font-size="23" fill="#526B7B" font-weight="400" text-anchor="middle">Supported</text><text x="720" y="434" font-size="23" fill="#526B7B" font-weight="400" text-anchor="middle">extension points</text><path d="M 572 494 H 869" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="720" y="473" font-size="27" fill="#126394" font-weight="700" text-anchor="middle">Evidence out</text><rect x="56" y="617" width="1328" height="119" rx="16" fill="#FAFCFD" stroke="#E1EAF0" stroke-width="2"/><text x="82" y="657" font-size="27" fill="#173248" font-weight="700" text-anchor="start">Execution and approvals remain in the native tool.</text><text x="82" y="698" font-size="25" fill="#177C76" font-weight="400" text-anchor="start">Grounding and event collection: Claude Code, Codex, and OpenCode.</text></g></svg>