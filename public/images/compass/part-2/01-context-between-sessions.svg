<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Context between sessions</title><desc id="desc">Project instructions cover broad rules. A maintained decision note supplies selected task context. The host owns session history; source maintenance remains necessary.</desc>
    <defs>
      <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#126394"/></marker>
      <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#177C76"/></marker>
      <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#8C631A"/></marker>
      <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
    </defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="760" fill="#FFFFFF"/><text x="64" y="56" font-size="22" fill="#126394" font-weight="700" text-anchor="start">INSIDE COMPASS   /   PART 2</text><text x="64" y="119" font-size="40" fill="#173248" font-weight="700" text-anchor="start">The source survives the session.</text><text x="64" y="161" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Broad instructions and task-specific notes have different jobs.</text><rect x="65" y="230" width="385" height="180" rx="18" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="89" y="277" font-size="28" fill="#126394" font-weight="700" text-anchor="start">Project instructions</text><text x="89" y="321" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Conventions</text><text x="89" y="353" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Common working rules</text><rect x="528" y="230" width="385" height="180" rx="18" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="552" y="277" font-size="28" fill="#177C76" font-weight="700" text-anchor="start">Decision note</text><text x="552" y="321" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Constraint + reason</text><text x="552" y="353" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Source + verification</text><rect x="990" y="230" width="385" height="180" rx="18" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="1014" y="277" font-size="28" fill="#126394" font-weight="700" text-anchor="start">Current session</text><text x="1014" y="321" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Receives a selected brief</text><text x="1014" y="353" font-size="23" fill="#526B7B" font-weight="400" text-anchor="start">Host owns retention</text><path d="M 928 320 H 973" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="65" y="480" width="1310" height="151" rx="18" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="96" y="528" font-size="29" fill="#177C76" font-weight="700" text-anchor="start">Illustrative export constraint</text><text x="96" y="572" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Advance the checkpoint only after destination acknowledgement.</text><text x="96" y="606" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Keep the retry test beside the decision, so the next change can check it.</text><text x="65" y="711" font-size="25" fill="#173248" font-weight="400" text-anchor="start">A selected brief can miss a source or include a stale note. Maintenance still matters.</text></g></svg>