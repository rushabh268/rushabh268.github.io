<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Evidence boundaries</title><desc id="desc">Three claims require separate evidence: an adapter emission, a passing test, and a correct behavior change.</desc>
    <defs>
      <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#126394"/></marker>
      <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#177C76"/></marker>
      <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#8C631A"/></marker>
      <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
    </defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="760" fill="#FFFFFF"/><text x="64" y="56" font-size="22" fill="#126394" font-weight="700" text-anchor="start">INSIDE COMPASS   /   PART 2</text><text x="64" y="119" font-size="40" fill="#173248" font-weight="700" text-anchor="start">Different claims need different evidence.</text><text x="64" y="161" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">An emission record is narrower than a verified outcome.</text><rect x="65" y="225" width="1310" height="132" rx="18" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="94" y="269" font-size="29" fill="#173248" font-weight="700" text-anchor="start">Adapter emitted a brief</text><text x="94" y="316" font-size="25" fill="#177C76" font-weight="400" text-anchor="start">Emission record</text><text x="735" y="307" font-size="25" fill="#526B7B" font-weight="400" text-anchor="start">Does not prove host acceptance or model use</text><rect x="65" y="395" width="1310" height="132" rx="18" fill="#F1F7FB" stroke="#C9DCE7" stroke-width="2"/><text x="94" y="439" font-size="29" fill="#173248" font-weight="700" text-anchor="start">A test passed</text><text x="94" y="486" font-size="25" fill="#177C76" font-weight="400" text-anchor="start">Result for the relevant invocation</text><text x="735" y="477" font-size="25" fill="#526B7B" font-weight="400" text-anchor="start">Does not prove every case is covered</text><rect x="65" y="565" width="1310" height="132" rx="18" fill="#EDF8F4" stroke="#C9DCE7" stroke-width="2"/><text x="94" y="609" font-size="29" fill="#173248" font-weight="700" text-anchor="start">The change works</text><text x="94" y="656" font-size="25" fill="#177C76" font-weight="400" text-anchor="start">Behavioral checks + review</text><text x="735" y="647" font-size="25" fill="#526B7B" font-weight="400" text-anchor="start">Scope and environment still matter</text></g></svg>
