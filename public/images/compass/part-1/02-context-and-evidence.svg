<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="834" viewBox="0 0 1440 834" role="img" aria-labelledby="title desc"><title id="title">Two separate flows: context in and audit metadata out</title><desc id="desc">Maintained sources become a cited brief for a supported model request. Tool events become selected metadata in a local ledger and dashboard. Automatic grounding is implemented across all three adapters.</desc>
    <defs>
      <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#126394"/></marker>
      <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#177C76"/></marker>
      <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#8C631A"/></marker>
      <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
    </defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="834" fill="#FFFFFF"/><text x="56" y="52" font-size="19" fill="#126394" font-weight="700" text-anchor="start">INSIDE COMPASS   /   02</text><text x="56" y="108" font-size="39" fill="#173248" font-weight="700" text-anchor="start">Context and audit records are different flows.</text><text x="56" y="149" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Each flow keeps only the information needed for its purpose.</text><rect x="56" y="185" width="1328" height="251" rx="20" fill="#EDF8F4" stroke="#D2E7DF" stroke-width="2"/><text x="82" y="222" font-size="21" fill="#177C76" font-weight="700" text-anchor="start">CONTEXT TO THE MODEL</text><rect x="88" y="246" width="352" height="121" rx="15" fill="white" stroke="#C6E0D7" stroke-width="2"/><text x="110" y="286" font-size="28" fill="#173248" font-weight="700" text-anchor="start">Project sources</text><text x="110" y="320" font-size="22" fill="#526B7B" font-weight="400" text-anchor="start">Notes + code comments</text><text x="110" y="350" font-size="22" fill="#526B7B" font-weight="400" text-anchor="start">Maintained outside chat</text><rect x="544" y="246" width="352" height="121" rx="15" fill="white" stroke="#C6E0D7" stroke-width="2"/><text x="566" y="286" font-size="28" fill="#173248" font-weight="700" text-anchor="start">Prepare a brief</text><text x="566" y="320" font-size="22" fill="#526B7B" font-weight="400" text-anchor="start">Select · redact · cite</text><text x="566" y="350" font-size="22" fill="#526B7B" font-weight="400" text-anchor="start">Keep within a budget</text><rect x="1000" y="246" width="352" height="121" rx="15" fill="white" stroke="#C6E0D7" stroke-width="2"/><text x="1022" y="286" font-size="28" fill="#173248" font-weight="700" text-anchor="start">Model request</text><text x="1022" y="320" font-size="22" fill="#526B7B" font-weight="400" text-anchor="start">Through a supported</text><text x="1022" y="350" font-size="22" fill="#526B7B" font-weight="400" text-anchor="start">context-injection point</text><path d="M 456 306 H 528" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 912 306 H 984" stroke="#177C76" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="82" y="408" font-size="23" fill="#177C76" font-weight="400" text-anchor="start">Automatic grounding: Claude Code · Codex · OpenCode.</text><rect x="56" y="469" width="1328" height="269" rx="20" fill="#F1F7FB" stroke="#D6E5EE" stroke-width="2"/><text x="82" y="506" font-size="21" fill="#126394" font-weight="700" text-anchor="start">OBSERVATIONS TO THE DEVELOPER</text><rect x="88" y="532" width="268" height="151" rx="15" fill="white" stroke="#C9DCE7" stroke-width="2"/><text x="106" y="577" font-size="25" fill="#173248" font-weight="700" text-anchor="start">Tool events</text><text x="106" y="615" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Hooks or plugin</text><text x="106" y="645" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">events</text><rect x="420" y="532" width="268" height="151" rx="15" fill="white" stroke="#C9DCE7" stroke-width="2"/><text x="438" y="577" font-size="25" fill="#173248" font-weight="700" text-anchor="start">Select metadata</text><text x="438" y="615" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Normalize + inspect</text><text x="438" y="645" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">credential patterns</text><rect x="752" y="532" width="268" height="151" rx="15" fill="white" stroke="#C9DCE7" stroke-width="2"/><text x="770" y="577" font-size="25" fill="#173248" font-weight="700" text-anchor="start">Local ledger</text><text x="770" y="615" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Limited event schema</text><text x="770" y="645" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Integrity checks</text><rect x="1084" y="532" width="268" height="151" rx="15" fill="white" stroke="#C9DCE7" stroke-width="2"/><text x="1102" y="577" font-size="25" fill="#173248" font-weight="700" text-anchor="start">Dashboard</text><text x="1102" y="615" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Recent counts</text><text x="1102" y="645" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">By platform + event</text><path d="M 372 607 H 404" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 704 607 H 736" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1036 607 H 1068" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="82" y="713" font-size="23" fill="#126394" font-weight="400" text-anchor="start">The stored record contains selected metadata, not the raw conversation or tool output.</text><text x="56" y="794" font-size="26" fill="#173248" font-weight="500" text-anchor="start">A recorded event supports an observation. Correctness still needs verification.</text></g></svg>