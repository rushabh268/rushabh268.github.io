<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">A shared companion core with tool-specific adapters</title><desc id="desc">Claude Code, Codex, and OpenCode event adapters are implemented. Automatic grounding is implemented in all three adapters. The shared core covers grounding, the event contract, credential-pattern rules, audit ledger, and dashboard.</desc>
    <defs>
      <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#126394"/></marker>
      <marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#177C76"/></marker>
      <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#8C631A"/></marker>
      <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
    </defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="860" fill="#FFFFFF"/><text x="56" y="52" font-size="19" fill="#126394" font-weight="700" text-anchor="start">INSIDE COMPASS   /   03</text><text x="56" y="108" font-size="39" fill="#173248" font-weight="700" text-anchor="start">One common core. A separate adapter for each tool.</text><text x="56" y="149" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Shared capabilities connect through each tool’s native interface.</text><rect x="56" y="186" width="392" height="97" rx="18" fill="#F1F7FB" stroke="#B9D6E6" stroke-width="2"/><text x="252" y="244" font-size="32" fill="#126394" font-weight="700" text-anchor="middle">Claude Code</text><path d="M 252 296 V 344" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="56" y="358" width="392" height="184" rx="18" fill="white" stroke="#C3DBE9" stroke-width="2"/><rect x="76" y="379" width="158" height="38" rx="19" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="155.0" y="405" font-size="18" fill="#126394" font-weight="700" text-anchor="middle">IMPLEMENTED</text><text x="78" y="455" font-size="28" fill="#173248" font-weight="700" text-anchor="start">Claude adapter</text><text x="78" y="492" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Hook-based event collection</text><text x="78" y="521" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Automatic grounding</text><path d="M 252 557 V 635" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="524" y="186" width="392" height="97" rx="18" fill="#F1F7FB" stroke="#B9D6E6" stroke-width="2"/><text x="720" y="244" font-size="32" fill="#126394" font-weight="700" text-anchor="middle">Codex</text><path d="M 720 296 V 344" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="524" y="358" width="392" height="184" rx="18" fill="white" stroke="#C3DBE9" stroke-width="2"/><rect x="544" y="379" width="158" height="38" rx="19" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="623.0" y="405" font-size="18" fill="#126394" font-weight="700" text-anchor="middle">IMPLEMENTED</text><text x="546" y="455" font-size="28" fill="#173248" font-weight="700" text-anchor="start">Codex adapter</text><text x="546" y="492" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Hook-based event collection</text><text x="546" y="521" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Automatic grounding</text><path d="M 720 557 V 635" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="992" y="186" width="392" height="97" rx="18" fill="#F1F7FB" stroke="#B9D6E6" stroke-width="2"/><text x="1188" y="244" font-size="32" fill="#126394" font-weight="700" text-anchor="middle">OpenCode</text><path d="M 1188 296 V 344" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="992" y="358" width="392" height="184" rx="18" fill="white" stroke="#C3DBE9" stroke-width="2"/><rect x="1012" y="379" width="158" height="38" rx="19" fill="#F1F7FB" stroke="#F1F7FB" stroke-width="2"/><text x="1091.0" y="405" font-size="18" fill="#126394" font-weight="700" text-anchor="middle">IMPLEMENTED</text><text x="1014" y="455" font-size="28" fill="#173248" font-weight="700" text-anchor="start">OpenCode adapter</text><text x="1014" y="492" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Plugin event collection</text><text x="1014" y="521" font-size="21" fill="#526B7B" font-weight="400" text-anchor="start">Automatic grounding</text><path d="M 1188 557 V 635" stroke="#126394" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="56" y="651" width="1328" height="120" rx="20" fill="#EDF8F4" stroke="#B7DCD2" stroke-width="2"/><text x="720" y="697" font-size="31" fill="#177C76" font-weight="700" text-anchor="middle">Shared Compass core</text><text x="720" y="740" font-size="26" fill="#173248" font-weight="400" text-anchor="middle">Grounding · Event contract · Credential-pattern rules · Ledger · Dashboard</text><text x="56" y="819" font-size="24" fill="#526B7B" font-weight="400" text-anchor="start">Automatic grounding, audit observations, and dashboard: all three tools.</text></g></svg>